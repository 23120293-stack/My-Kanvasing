<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#15181a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Log Kanvasing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --charcoal:#121417;
    --graphite:#1b1f22;
    --graphite-2:#242a2d;
    --spark:#ff5a1f;
    --spark-2:#ffb020;
    --grad: linear-gradient(135deg, #ff5a1f 0%, #ffb020 100%);
    --paper:#f3f2ec;
    --steel:#8f9ba1;
    --line:#2c3235;
    --ok:#2fd58a;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    background:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(255,90,31,0.10), transparent 60%),
      var(--charcoal);
    color:var(--paper);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding-bottom:96px;
    min-height:100vh;
  }
  h1, .card-company, .btn-primary, .tab-btn, .stat-num, .section-title, label{
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(18,20,23,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:20px 20px 18px;
  }
  .header-top{display:flex; align-items:center; gap:12px;}
  .header-icon{
    width:38px; height:38px; border-radius:11px; background:var(--grad);
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow:0 6px 16px rgba(255,90,31,0.35); flex-shrink:0;
  }
  header h1{font-size:16.5px; font-weight:800; letter-spacing:0.01em;}
  header .subtitle{font-size:11.5px; color:var(--steel); margin-top:1px; font-weight:500;}

  /* ---------- Bottom Nav ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(18,20,23,0.96); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex; padding:8px 14px calc(10px + env(safe-area-inset-bottom));
    gap:8px;
    max-width:520px; margin:0 auto;
  }
  .tab-btn{
    flex:1; background:transparent; border:none; color:var(--steel);
    font-size:11.5px; padding:10px 8px 8px; border-radius:14px; font-weight:700;
    transition:all 0.2s; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .tab-btn .tab-icon{font-size:19px; line-height:1;}
  .tab-btn.active{color:var(--spark-2); background:rgba(255,90,31,0.1);}

  main{max-width:520px; margin:0 auto; padding:20px 18px;}
  .view{display:none;}
  .view.active{display:block;}

  .form-section{
    background:var(--graphite); border:1px solid var(--line); border-radius:18px;
    padding:20px 18px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .form-section-head{
    display:flex; align-items:center; gap:9px; margin-bottom:16px;
    padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .form-section-head .fs-icon{
    width:30px; height:30px; border-radius:9px; background:var(--graphite-2);
    display:flex; align-items:center; justify-content:center; font-size:14.5px; flex-shrink:0;
  }
  .form-section-head h2{
    font-family:'Plus Jakarta Sans',sans-serif; font-size:13.5px; font-weight:800;
    letter-spacing:0.02em; text-transform:uppercase; color:var(--paper);
  }
  .form-section .field:last-child{margin-bottom:0;}

  .field{margin-bottom:16px; position:relative;}
  .field label{display:block; font-size:12.5px; color:var(--steel); margin-bottom:7px; font-weight:600; letter-spacing:0.01em;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--graphite); border:1.5px solid var(--line); color:var(--paper);
    padding:13px 15px; border-radius:12px; font-size:15px; font-family:inherit;
    transition:border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--spark); box-shadow:0 0 0 3px rgba(255,90,31,0.15);
  }
  .field textarea{resize:vertical; min-height:70px;}
  .req{color:var(--spark);}

  .suggest-box{
    position:absolute; top:100%; left:0; right:0; z-index:20;
    background:var(--graphite-2); border:1.5px solid var(--line); border-top:none;
    border-radius:0 0 12px 12px; max-height:180px; overflow-y:auto;
    display:none; box-shadow:var(--shadow);
  }
  .suggest-box.show{display:block;}
  .suggest-item{padding:12px 15px; font-size:14px; color:var(--paper); border-bottom:1px solid var(--line);}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:active{background:var(--spark); color:#15181a;}

  .chip-group{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:9px 15px; border:1.5px solid var(--line); border-radius:999px; font-size:13px;
    color:var(--steel); background:var(--graphite); font-weight:600; user-select:none;
    transition:all 0.2s;
  }
  .chip.selected{background:var(--grad); border-color:transparent; color:#15181a; box-shadow:0 4px 12px rgba(255,90,31,0.3);}

  .btn-primary{
    width:100%; background:var(--grad); color:#15181a; border:none;
    padding:16px; border-radius:14px; font-size:15px; font-weight:800;
    margin-top:6px; letter-spacing:0.01em;
    box-shadow:0 6px 18px rgba(255,90,31,0.3);
    transition:transform 0.15s;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{
    width:100%; background:var(--graphite); color:var(--paper); border:1.5px solid var(--line);
    padding:14px; border-radius:14px; font-size:14px; font-weight:700; margin-top:10px;
  }

  .section-title{font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--steel); margin:22px 0 12px; font-weight:800;}

  .card{
    background:var(--graphite); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px;}
  .card-identity{display:flex; align-items:flex-start; gap:11px; min-width:0;}
  .card-avatar{
    width:38px; height:38px; border-radius:11px; background:var(--grad); color:#15181a;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;
    flex-shrink:0; box-shadow:0 4px 10px rgba(255,90,31,0.3);
  }
  .card-company{font-size:15px; font-weight:800; letter-spacing:0.005em; line-height:1.3;}
  .card-sub{font-size:11.5px; color:var(--steel); margin-top:2px;}
  .card-date{font-size:10.5px; color:var(--steel); font-family:'Inter',monospace; white-space:nowrap; background:var(--graphite-2); padding:4px 9px; border-radius:7px; flex-shrink:0;}
  .card-row{font-size:13.5px; color:var(--steel); margin-top:6px; line-height:1.55; padding-left:49px;}
  .card-row b{color:var(--paper); font-weight:600;}
  .card-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:11px; padding-left:49px;}
  .card-tag{font-size:11px; background:var(--graphite-2); color:var(--spark-2); padding:5px 10px; border-radius:7px; font-weight:700;}
  .card-actions{display:flex; gap:8px; margin-top:14px; padding-left:49px;}
  .card-actions button{
    flex:1; background:var(--graphite-2); border:1px solid var(--line); color:var(--steel);
    padding:10px; border-radius:10px; font-size:12px; font-weight:700;
  }
  .card-actions .del{color:#ff6b6b;}

  .empty{text-align:center; color:var(--steel); font-size:13.5px; padding:60px 20px;}
  .empty .empty-icon{font-size:34px; margin-bottom:12px; opacity:0.5;}

  .search-bar{margin-bottom:16px;}
  .search-bar input{
    width:100%; background:var(--graphite); border:1.5px solid var(--line); color:var(--paper);
    padding:13px 15px; border-radius:12px; font-size:14px;
  }

  .toast{
    position:fixed; bottom:88px; left:50%; transform:translateX(-50%);
    background:var(--ok); color:#0e1a14; padding:13px 22px; border-radius:12px;
    font-size:13.5px; font-weight:800; opacity:0; transition:opacity 0.25s;
    pointer-events:none; z-index:50; box-shadow:var(--shadow); text-align:center; max-width:88%;
  }
  .toast.show{opacity:1;}

  .stat-row{display:flex; gap:10px; margin-bottom:18px;}
  .stat{flex:1; background:var(--graphite); border:1px solid var(--line); border-radius:16px; padding:16px 12px; text-align:center; box-shadow:var(--shadow);}
  .stat-icon{font-size:16px; margin-bottom:6px; opacity:0.85;}
  .stat-num{font-size:21px; font-weight:800; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .stat-label{font-size:10px; color:var(--steel); margin-top:3px; text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}

  .pagination{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:18px; margin-bottom:8px;
  }
  .page-btn{
    background:var(--graphite); border:1px solid var(--line); color:var(--paper);
    width:38px; height:38px; border-radius:11px; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .page-btn:disabled{opacity:0.35;}
  .page-info{
    font-size:12.5px; color:var(--steel); font-weight:700; font-family:'Plus Jakarta Sans',sans-serif;
    min-width:76px; text-align:center;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-icon">⚡</div>
    <div>
      <h1>Log Kanvasing</h1>
      <div class="subtitle">Synergis × Bodor Field Sales</div>
    </div>
  </div>
</header>

<nav class="bottom-nav">
  <button class="tab-btn active" data-view="form"><span class="tab-icon">📝</span>Catat Baru</button>
  <button class="tab-btn" data-view="list"><span class="tab-icon">📊</span>Riwayat</button>
</nav>

<main>
  <!-- FORM VIEW -->
  <div class="view active" id="view-form">
    <div class="form-section">
      <div class="form-section-head">
        <div class="fs-icon">🏢</div>
        <h2>Perusahaan</h2>
      </div>
      <div class="field">
        <label>Tanggal Kanvasing <span class="req">*</span></label>
        <input type="date" id="f-tanggal">
      </div>
      <div class="field">
        <label>Daerah Kanvasing <span class="req">*</span></label>
        <input type="text" id="f-daerah" autocomplete="off" placeholder="Cth: Cirebon, Bekasi Timur">
        <div class="suggest-box" id="sg-daerah"></div>
      </div>
      <div class="field">
        <label>Nama Perusahaan <span class="req">*</span></label>
        <input type="text" id="f-perusahaan" autocomplete="off" placeholder="PT / CV ...">
        <div class="suggest-box" id="sg-perusahaan"></div>
      </div>
      <div class="field">
        <label>Bergerak di Bidang Apa</label>
        <input type="text" id="f-bidang" autocomplete="off" placeholder="Cth: Fabrikasi sheet metal">
        <div class="suggest-box" id="sg-bidang"></div>
      </div>
      <div class="field">
        <label>Sudah Punya Mesin Apa Saja</label>
        <input type="text" id="f-mesineksisting" autocomplete="off" placeholder="Cth: Las MIG, gunting plat manual">
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-head">
        <div class="fs-icon">📍</div>
        <h2>Lokasi</h2>
      </div>
      <div class="field">
        <label>Lokasi / Alamat Persis (opsional)</label>
        <input type="text" id="f-lokasi" autocomplete="off" placeholder="Tap tombol di bawah untuk deteksi otomatis">
        <button type="button" class="btn-secondary" id="btn-detect-location" style="margin-top:10px;">📍 Deteksi Lokasi Otomatis</button>
        <div id="location-status" style="font-size:12px; color:var(--steel); margin-top:8px;"></div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-head">
        <div class="fs-icon">👤</div>
        <h2>Kontak</h2>
      </div>
      <div class="field">
        <label>Nama Owner</label>
        <input type="text" id="f-owner" autocomplete="off" placeholder="Nama pemilik perusahaan">
        <div class="suggest-box" id="sg-owner"></div>
      </div>
      <div class="field">
        <label>Nama yang Ditemui Saat Kanvasing</label>
        <input type="text" id="f-kontak" autocomplete="off" placeholder="Nama PIC / staff yang ditemui">
        <div class="suggest-box" id="sg-kontak"></div>
      </div>
      <div class="field">
        <label>No. HP</label>
        <input type="tel" id="f-hp" placeholder="08xxxxxxxxxx">
      </div>
      <div class="field">
        <label>Email Perusahaan</label>
        <input type="email" id="f-email" placeholder="nama@perusahaan.com">
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-head">
        <div class="fs-icon">🎯</div>
        <h2>Kebutuhan & Hasil</h2>
      </div>
      <div class="field">
        <label>Kebutuhan (dari produk yang dijual)</label>
        <div class="chip-group" id="chip-kebutuhan">
          <div class="chip" data-val="Plate Laser Cutting">Plate Laser Cutting</div>
          <div class="chip" data-val="Tube Laser Cutting">Tube Laser Cutting</div>
          <div class="chip" data-val="Welding">Welding</div>
          <div class="chip" data-val="Bending">Bending</div>
          <div class="chip" data-val="Shearing">Shearing</div>
          <div class="chip" data-val="Belum Jelas">Belum Jelas</div>
          <div class="chip" data-val="Tidak Ada">Tidak Ada</div>
        </div>
      </div>
      <div class="field">
        <label>Hasil / Catatan Laporan</label>
        <textarea id="f-hasil" placeholder="Cth: Tertarik tapi masih bandingkan harga, follow up minggu depan..."></textarea>
      </div>
    </div>

    <button class="btn-primary" id="btn-save">Simpan Data</button>
  </div>

  <!-- LIST VIEW -->
  <div class="view" id="view-list">
    <div class="form-section">
      <div class="form-section-head">
        <div class="fs-icon">🔗</div>
        <h2>Sinkron Google Sheets</h2>
        <span id="sync-status" style="margin-left:auto; font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:7px; background:var(--graphite-2); color:var(--steel); white-space:nowrap;">Belum tersambung</span>
      </div>
      <div class="field">
        <label>Web App URL dari Apps Script</label>
        <input type="text" id="sync-url-input" placeholder="https://script.google.com/macros/s/...">
      </div>
      <button class="btn-secondary" id="btn-save-sync" style="margin-top:0;">Simpan Koneksi</button>
      <button class="btn-secondary" id="btn-pull-sync">⬇ Tarik Ulang Riwayat dari Sheets</button>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="stat-icon">📋</div><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-icon">☀️</div><div class="stat-num" id="stat-today">0</div><div class="stat-label">Hari Ini</div></div>
      <div class="stat"><div class="stat-icon">🗺️</div><div class="stat-num" id="stat-daerah">0</div><div class="stat-label">Daerah</div></div>
    </div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Cari perusahaan, daerah, atau nama...">
    </div>
    <div id="list-container"></div>
    <div class="pagination" id="pagination"></div>
    <button class="btn-secondary" id="btn-export">⬇ Export ke Excel (untuk Sheets)</button>
  </div>
</main>

<div class="toast" id="toast">Tersimpan!</div>

<script>
const STORAGE_KEY = 'canvassing:records';
const SYNC_URL_KEY = 'canvassing:sheetsUrl';
let records = [];
let editingId = null;
let kebutuhanSelected = [];
let currentLat = null;
let currentLng = null;
let currentPage = 1;
const PAGE_SIZE = 10;

const $ = id => document.getElementById(id);

// ---------- Deteksi Lokasi ----------
$('btn-detect-location').addEventListener('click', () => {
  if(!navigator.geolocation){
    $('location-status').textContent = 'HP/browser tidak mendukung deteksi lokasi';
    return;
  }
  $('location-status').textContent = 'Mendeteksi lokasi...';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    currentLat = pos.coords.latitude;
    currentLng = pos.coords.longitude;
    $('location-status').textContent = 'Mencari nama alamat...';
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}&zoom=18&addressdetails=1`);
      const data = await res.json();
      $('f-lokasi').value = data.display_name || `${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;
      $('location-status').textContent = '✅ Lokasi terdeteksi';
    }catch(e){
      $('f-lokasi').value = `${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;
      $('location-status').textContent = '✅ Koordinat terdeteksi (nama alamat gagal dimuat)';
    }
  }, (err) => {
    $('location-status').textContent = 'Gagal mendeteksi lokasi — pastikan izin lokasi diaktifkan';
  }, { enableHighAccuracy: true, timeout: 10000 });
});

// ---------- Sync settings ----------
function getSyncUrl(){
  return localStorage.getItem(SYNC_URL_KEY) || '';
}

function updateSyncStatus(){
  const url = getSyncUrl();
  const badge = $('sync-status');
  $('sync-url-input').value = url;
  if(url){
    badge.textContent = 'Tersambung';
    badge.style.background = 'rgba(47,213,138,0.15)';
    badge.style.color = 'var(--ok)';
  }else{
    badge.textContent = 'Belum tersambung';
    badge.style.background = 'var(--graphite-2)';
    badge.style.color = 'var(--steel)';
  }
}

$('btn-save-sync').addEventListener('click', ()=>{
  const url = $('sync-url-input').value.trim();
  if(url && !url.startsWith('https://script.google.com/')){
    showToast('URL sepertinya bukan link Apps Script yang valid', true);
    return;
  }
  localStorage.setItem(SYNC_URL_KEY, url);
  updateSyncStatus();
  showToast(url ? 'Terhubung ke Google Sheets!' : 'Koneksi dihapus');
});

async function pushToSheets(record){
  const url = getSyncUrl();
  if(!url) return;
  try{
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(record)
    });
  }catch(e){
    console.error('Gagal sync ke Sheets', e);
  }
}

async function pullFromSheets(){
  const url = getSyncUrl();
  if(!url){
    showToast('Hubungkan ke Sheets dulu sebelum menarik data', true);
    return;
  }
  showToast('Menarik data dari Sheets...');
  try{
    const res = await fetch(url, { method: 'GET' });
    const data = await res.json();
    const sheetRecords = data.records || [];

    if(sheetRecords.length === 0){
      showToast('Tidak ada data ditemukan di Sheets', true);
      return;
    }

    const localIds = new Set(records.map(r => r.id));
    let added = 0;
    sheetRecords.forEach(r => {
      if(!localIds.has(r.id)){
        records.push(r);
        added++;
      }
    });

    records.sort((a,b) => (b.tanggal||'').localeCompare(a.tanggal||''));
    await saveRecords();
    renderList($('search-input').value);
    showToast(`Berhasil menarik ${added} data baru dari Sheets`);
  }catch(e){
    console.error('Gagal tarik data dari Sheets', e);
    showToast('Gagal menarik data — cek koneksi internet', true);
  }
}

$('btn-pull-sync').addEventListener('click', pullFromSheets);

// ---------- Load ----------
async function loadRecords(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    records = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('Storage error', e);
    records = [];
  }
  renderList();
}

async function saveRecords(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }catch(e){
    console.error('Storage error', e);
    showToast('Gagal menyimpan — storage penuh atau tidak didukung', true);
  }
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    $('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view === 'list'){ renderList(); updateSyncStatus(); }
  });
});

// ---------- Chips ----------
document.querySelectorAll('#chip-kebutuhan .chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    const val = chip.dataset.val;
    if(kebutuhanSelected.includes(val)){
      kebutuhanSelected = kebutuhanSelected.filter(v=>v!==val);
      chip.classList.remove('selected');
    }else{
      kebutuhanSelected.push(val);
      chip.classList.add('selected');
    }
  });
});

// ---------- Autocomplete ----------
const autocompleteFields = [
  {input:'f-daerah', box:'sg-daerah', key:'daerah'},
  {input:'f-perusahaan', box:'sg-perusahaan', key:'perusahaan'},
  {input:'f-bidang', box:'sg-bidang', key:'bidang'},
  {input:'f-owner', box:'sg-owner', key:'owner'},
  {input:'f-kontak', box:'sg-kontak', key:'kontak'},
];

function getUniqueValues(key){
  const vals = records.map(r=>r[key]).filter(v=>v && v.trim().length>0);
  return [...new Set(vals)];
}

autocompleteFields.forEach(cfg=>{
  const input = $(cfg.input);
  const box = $(cfg.box);

  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    const all = getUniqueValues(cfg.key);
    const matches = q ? all.filter(v=>v.toLowerCase().includes(q)) : all;
    if(matches.length === 0){ box.classList.remove('show'); return; }
    box.innerHTML = matches.slice(0,6).map(v=>`<div class="suggest-item">${escapeHtml(v)}</div>`).join('');
    box.classList.add('show');
  });

  input.addEventListener('focus', ()=>{
    input.dispatchEvent(new Event('input'));
  });

  box.addEventListener('click', (e)=>{
    if(e.target.classList.contains('suggest-item')){
      input.value = e.target.textContent;
      box.classList.remove('show');
    }
  });

  document.addEventListener('click', (e)=>{
    if(!input.contains(e.target) && !box.contains(e.target)){
      box.classList.remove('show');
    }
  });
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Save ----------
$('btn-save').addEventListener('click', async ()=>{
  const tanggal = $('f-tanggal').value;
  const daerah = $('f-daerah').value.trim();
  const perusahaan = $('f-perusahaan').value.trim();

  if(!tanggal || !daerah || !perusahaan){
    showToast('Tanggal, daerah, dan nama perusahaan wajib diisi', true);
    return;
  }

  const record = {
    id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
    tanggal,
    daerah,
    perusahaan,
    bidang: $('f-bidang').value.trim(),
    mesineksisting: $('f-mesineksisting').value.trim(),
    owner: $('f-owner').value.trim(),
    kontak: $('f-kontak').value.trim(),
    hp: $('f-hp').value.trim(),
    email: $('f-email').value.trim(),
    kebutuhan: [...kebutuhanSelected],
    hasil: $('f-hasil').value.trim(),
    lokasi: $('f-lokasi').value.trim(),
    lat: currentLat,
    lng: currentLng,
    mapsLink: (currentLat && currentLng) ? `https://www.google.com/maps?q=${currentLat},${currentLng}` : '',
  };

  const isNew = !editingId;

  if(editingId){
    const idx = records.findIndex(r=>r.id === editingId);
    if(idx > -1) records[idx] = record;
    editingId = null;
    $('btn-save').textContent = 'Simpan Data';
  }else{
    records.unshift(record);
  }

  await saveRecords();
  pushToSheets(record);
  clearForm();
  showToast('Data tersimpan!' + (getSyncUrl() ? ' Mengirim ke Sheets...' : ''));
});

function clearForm(){
  ['f-daerah','f-perusahaan','f-bidang','f-mesineksisting','f-owner','f-kontak','f-hp','f-email','f-hasil','f-lokasi'].forEach(id=>$(id).value='');
  $('f-tanggal').value = todayStr();
  $('location-status').textContent = '';
  currentLat = null;
  currentLng = null;
  kebutuhanSelected = [];
  document.querySelectorAll('#chip-kebutuhan .chip').forEach(c=>c.classList.remove('selected'));
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

// ---------- List / render ----------
function renderList(filter=''){
  const container = $('list-container');
  let filtered = records;
  if(filter){
    const q = filter.toLowerCase();
    filtered = records.filter(r =>
      (r.perusahaan||'').toLowerCase().includes(q) ||
      (r.daerah||'').toLowerCase().includes(q) ||
      (r.owner||'').toLowerCase().includes(q) ||
      (r.kontak||'').toLowerCase().includes(q)
    );
  }

  $('stat-total').textContent = records.length;
  $('stat-today').textContent = records.filter(r=>r.tanggal === todayStr()).length;
  $('stat-daerah').textContent = new Set(records.map(r=>r.daerah)).size;

  if(filtered.length === 0){
    container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>Belum ada data kanvasing.<br>Isi form di tab "Catat Baru" untuk mulai mencatat.</div>';
    $('pagination').innerHTML = '';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;

  const startIdx = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

  container.innerHTML = pageItems.map(r => {
    const initial = (r.perusahaan||'?').trim().charAt(0).toUpperCase();
    return `
    <div class="card" data-id="${r.id}">
      <div class="card-top">
        <div class="card-identity">
          <div class="card-avatar">${initial}</div>
          <div>
            <div class="card-company">${escapeHtml(r.perusahaan)}</div>
            <div class="card-sub">📍 ${escapeHtml(r.daerah)}${r.bidang ? ' — '+escapeHtml(r.bidang) : ''}</div>
          </div>
        </div>
        <div class="card-date">${formatDate(r.tanggal)}</div>
      </div>
      ${r.owner ? `<div class="card-row"><b>Owner:</b> ${escapeHtml(r.owner)}</div>` : ''}
      ${r.kontak ? `<div class="card-row"><b>Ditemui:</b> ${escapeHtml(r.kontak)}</div>` : ''}
      ${r.lokasi ? `<div class="card-row">🏠 ${escapeHtml(r.lokasi)}</div>` : ''}
      ${r.hp || r.email ? `<div class="card-row">${escapeHtml(r.hp||'')}${r.hp && r.email ? ' · ' : ''}${escapeHtml(r.email||'')}</div>` : ''}
      ${r.hasil ? `<div class="card-row"><b>Catatan:</b> ${escapeHtml(r.hasil)}</div>` : ''}
      ${r.kebutuhan && r.kebutuhan.length ? `<div class="card-tags">${r.kebutuhan.map(k=>`<span class="card-tag">${escapeHtml(k)}</span>`).join('')}</div>` : ''}
      <div class="card-actions">
        <button class="edit-btn">✏️ Edit</button>
        ${r.mapsLink ? `<button onclick="window.open('${r.mapsLink}','_blank')">📍 Maps</button>` : ''}
        <button class="del del-btn">🗑️ Hapus</button>
      </div>
    </div>
  `;
  }).join('');

  // ---------- Pagination controls ----------
  const pag = $('pagination');
  if(totalPages <= 1){
    pag.innerHTML = '';
  }else{
    pag.innerHTML = `
      <button class="page-btn" id="page-prev" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
      <div class="page-info">Hal ${currentPage} / ${totalPages}</div>
      <button class="page-btn" id="page-next" ${currentPage === totalPages ? 'disabled' : ''}>›</button>
    `;
    const prevBtn = $('page-prev');
    const nextBtn = $('page-next');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{
      currentPage--;
      renderList(filter);
      $('list-container').scrollIntoView({behavior:'smooth', block:'start'});
    });
    if(nextBtn) nextBtn.addEventListener('click', ()=>{
      currentPage++;
      renderList(filter);
      $('list-container').scrollIntoView({behavior:'smooth', block:'start'});
    });
  }

  container.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = e.target.closest('.card').dataset.id;
      editRecord(id);
    });
  });
  container.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = e.target.closest('.card').dataset.id;
      deleteRecord(id);
    });
  });
}

function formatDate(str){
  if(!str) return '';
  const [y,m,d] = str.split('-');
  return `${d}/${m}/${y}`;
}

function editRecord(id){
  const r = records.find(x=>x.id===id);
  if(!r) return;
  editingId = id;
  $('f-tanggal').value = r.tanggal;
  $('f-daerah').value = r.daerah;
  $('f-perusahaan').value = r.perusahaan;
  $('f-bidang').value = r.bidang || '';
  $('f-mesineksisting').value = r.mesineksisting || '';
  $('f-owner').value = r.owner || '';
  $('f-kontak').value = r.kontak || '';
  $('f-hp').value = r.hp || '';
  $('f-email').value = r.email || '';
  $('f-hasil').value = r.hasil || '';
  $('f-lokasi').value = r.lokasi || '';
  currentLat = r.lat || null;
  currentLng = r.lng || null;
  $('location-status').textContent = r.lokasi ? '✅ Lokasi tersimpan sebelumnya' : '';
  kebutuhanSelected = [...(r.kebutuhan||[])];
  document.querySelectorAll('#chip-kebutuhan .chip').forEach(c=>{
    c.classList.toggle('selected', kebutuhanSelected.includes(c.dataset.val));
  });
  $('btn-save').textContent = 'Update Data';

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelector('[data-view="form"]').classList.add('active');
  $('view-form').classList.add('active');
  window.scrollTo(0,0);
}

async function deleteRecord(id){
  if(!confirm('Hapus data ini?')) return;
  records = records.filter(r=>r.id!==id);
  await saveRecords();
  renderList($('search-input').value);
}

$('search-input').addEventListener('input', (e)=>{
  currentPage = 1;
  renderList(e.target.value);
});

// ---------- Export Excel ----------
$('btn-export').addEventListener('click', ()=>{
  if(records.length === 0){
    showToast('Belum ada data untuk di-export', true);
    return;
  }
  const headers = ['Tanggal','Daerah','Nama Perusahaan','Bidang Usaha','Mesin Eksisting','Nama Owner','Nama yang Ditemui','No HP','Email','Kebutuhan','Hasil / Catatan','Lokasi','Link Maps'];
  const rows = records.map(r => [
    formatDate(r.tanggal), r.daerah, r.perusahaan, r.bidang, r.mesineksisting, r.owner, r.kontak, r.hp, r.email,
    (r.kebutuhan||[]).join(', '), r.hasil, r.lokasi || '', r.mapsLink || ''
  ]);

  const wsData = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // Lebar kolom otomatis menyesuaikan isi
  ws['!cols'] = headers.map((h, i) => {
    const maxLen = Math.max(h.length, ...rows.map(r => (r[i]||'').toString().length));
    return { wch: Math.min(Math.max(maxLen + 2, 12), 40) };
  });

  // Style header: bold, background gelap, teks putih
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let c = range.s.c; c <= range.e.c; c++){
    const cellRef = XLSX.utils.encode_cell({ r: 0, c });
    if(!ws[cellRef]) continue;
    ws[cellRef].s = {
      font: { bold: true, color: { rgb: 'FFFFFF' } },
      fill: { fgColor: { rgb: '1B1F22' } },
      alignment: { vertical: 'center', horizontal: 'left' }
    };
  }

  // Warna selang-seling antar baris data
  for(let r = 1; r <= range.e.r; r++){
    const fill = (r % 2 === 0) ? 'F3F2EC' : 'FFF1E8';
    for(let c = range.s.c; c <= range.e.c; c++){
      const cellRef = XLSX.utils.encode_cell({ r, c });
      if(!ws[cellRef]) continue;
      ws[cellRef].s = {
        fill: { fgColor: { rgb: fill } },
        alignment: { vertical: 'top', wrapText: true }
      };
    }
  }

  ws['!freeze'] = { xSplit: 0, ySplit: 1 };
  ws['!autofilter'] = { ref: ws['!ref'] };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Log Kanvasing');
  XLSX.writeFile(wb, `kanvasing-${todayStr()}.xlsx`);

  showToast('Excel berhasil diunduh — tinggal upload ke Sheets');
});

// ---------- Toast ----------
let toastTimeout;
function showToast(msg, isError=false){
  const t = $('toast');
  t.textContent = msg;
  t.style.background = isError ? '#ff6b6b' : 'var(--ok)';
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- Init ----------
$('f-tanggal').value = todayStr();
loadRecords();
updateSyncStatus();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW gagal daftar:', e));
  });
}
